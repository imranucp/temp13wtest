name: dep-wf
on: 
  push:
    branches:
      - develop
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Weclome Message
        run: echo "Allah Always Help Me"
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Print Package.json Contents
        run: cat ./package.json
  dep-job:
    needs: lint-job
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment: 
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo for dep-job
        uses: actions/checkout@v4
      - name: Build Website With Parcel
        run: |
          npx parcel build ./src/index.html --dist-dir ./dist --public-url ./
      - name: Upload GitHub Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploye To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{github.token}}
      - name: End of Workf
        run: echo "Allah Always Help Me"

    
      

